name: Push to GitHub Packages

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  # Rebuild weekly to pick up security fixes in the base image.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          # setuptools_scm derives the Mailrise version from the git tags.
          fetch-depth: 0
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and Push
        uses: ./.github/actions/docker-build
        with:
          # GHCR image names must be lowercase. The package is linked to this
          # repository through the org.opencontainers.image.source label.
          images: ghcr.io/codedok/mailrise
