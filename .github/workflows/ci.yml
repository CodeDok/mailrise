name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Catch new vulnerabilities in the image even without code changes.
  schedule:
    - cron: '43 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - uses: actions/checkout@v6
        with:
          # setuptools_scm needs the history to compute the version.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[testing]' mypy
      - name: Test
        run: pytest
      - name: Type check
        run: mypy src tests

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build image
        run: docker build -t mailrise:ci .
      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:latest image --scanners vuln --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1 mailrise:ci
